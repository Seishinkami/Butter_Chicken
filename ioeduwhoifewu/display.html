<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Looping GIF Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
    .gif-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .gif-container img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Use 'contain' if you want to see the full GIF without cropping */
    }
  </style>
</head>
<body>

  <div class="gif-container">
    <img src="tumblr_o7laa1suyP1sa9pj8o4_400_3.webp" alt="Looping Curry and Rice GIF">
  </div>

</body>
</html>
